# Cross-compilation configuration for aarch64
# Requires: sudo apt-get install gcc-aarch64-linux-gnu
# Then uncomment and adjust paths:
#
# [target.aarch64-unknown-linux-gnu]
# linker = "aarch64-linux-gnu-gcc"
# rustflags = [
#     "-C", "linker=aarch64-linux-gnu-gcc",
#     "-C", "link-arg=-static",
# ]

# PGO profile configuration (use with merged profile data)
# [target.'cfg(all(target_arch = "x86_64", target_os = "linux"))']
# rustflags = ["-C", "profile-use=/tmp/pgo-data/merged.profdata"]
