name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: naso-${{ github.ref_name }}-x86_64-pc-windows-msvc
            archive_ext: .zip
            binary_suffix: .exe
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: naso-${{ github.ref_name }}-x86_64-unknown-linux-gnu
            archive_ext: .tar.gz
            binary_suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact_name: naso-${{ github.ref_name }}-aarch64-apple-darwin
            archive_ext: .tar.gz
            binary_suffix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev llvm-dev pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install llvm pkg-config

      - name: Build naso CLI
        run: cargo build --release --target ${{ matrix.target }} -p naso-compiler
        working-directory: .

      - name: Build naso-lsp
        run: cargo build --release --target ${{ matrix.target }} -p naso-lsp
        working-directory: .

      - name: Prepare artifacts
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT_DIR="artifacts/${{ matrix.artifact_name }}"
          mkdir -p "${ARTIFACT_DIR}"

          # Copy naso binary
          cp "target/${{ matrix.target }}/release/naso${{ matrix.binary_suffix }}" "${ARTIFACT_DIR}/naso${{ matrix.binary_suffix }}"

          # Copy naso-lsp binary
          cp "target/${{ matrix.target }}/release/naso-lsp${{ matrix.binary_suffix }}" "${ARTIFACT_DIR}/naso-lsp${{ matrix.binary_suffix }}"

          # Make binaries executable on Unix
          if [ "${{ matrix.target }}" != "x86_64-pc-windows-msvc" ]; then
            chmod +x "${ARTIFACT_DIR}/naso"
            chmod +x "${ARTIFACT_DIR}/naso-lsp"
          fi

      - name: Create archive
        shell: bash
        run: |
          ARTIFACT_DIR="artifacts/${{ matrix.artifact_name }}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            pwsh -NoProfile -Command "& { Compress-Archive -Path 'artifacts/${{ matrix.artifact_name }}/*' -DestinationPath \"artifacts/${{ matrix.artifact_name }}.zip\" -Force }"
          else
            cd artifacts
            tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}/"
            cd ..
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          ARTIFACT_DIR="artifacts"
          ARCHIVE="${{ matrix.artifact_name }}${{ matrix.archive_ext }}"

          if [ -f "${ARTIFACT_DIR}/${ARCHIVE}" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARTIFACT_DIR}/${ARCHIVE}" >> "${ARTIFACT_DIR}/SHA256SUMS.txt"
            else
              shasum -a 256 "${ARTIFACT_DIR}/${ARCHIVE}" >> "${ARTIFACT_DIR}/SHA256SUMS.txt"
            fi
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/${{ matrix.artifact_name }}${{ matrix.archive_ext }}
            artifacts/SHA256SUMS.txt
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: naso-*
          merge-multiple: true

      - name: Combine SHA256SUMS
        shell: bash
        run: |
          if [ -f "release_artifacts/SHA256SUMS.txt" ]; then
            cat release_artifacts/SHA256SUMS.txt > release_artifacts/SHA256SUMS
          else
            cat release_artifacts/*/SHA256SUMS.txt > release_artifacts/SHA256SUMS
          fi
          cat release_artifacts/SHA256SUMS

      - name: Copy installer scripts
        run: |
          mkdir -p release_artifacts/installers
          cp scripts/install.sh release_artifacts/installers/
          cp scripts/install.ps1 release_artifacts/installers/
          chmod +x release_artifacts/installers/install.sh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Naso ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            release_artifacts/*.tar.gz
            release_artifacts/*.zip
            release_artifacts/SHA256SUMS
            release_artifacts/installers/install.sh
            release_artifacts/installers/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets
        run: |
          echo "Release created successfully!"
          echo "Assets uploaded:"
          gh release view ${{ github.ref_name }} --json assets --jq '.assets[].name' | head -20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}