name: Deploy NasoChat to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # The npm project lives in app/, not at the repo root. Without this,
          # setup-node looks for a lockfile in the root and aborts the job.
          cache-dependency-path: app/package-lock.json

      # There is no root package.json; this is not a monorepo workspace root.
      # Install and build from app/ directly.
      - name: Install Dependencies
        run: npm ci
        working-directory: app

      - name: Inject COOP/COEP ServiceWorker for SharedArrayBuffer
        run: |
          # app/public is gitignored, so it does not exist in a fresh checkout.
          mkdir -p app/public
          curl -sL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js -o app/public/coi-serviceworker.js

      - name: Generate Nuxt 3 Static Site
        run: npm run generate
        working-directory: app
        env:
          # GitHub Pages serves this repo from a /naso/ subpath, so the
          # generated asset and router paths have to be prefixed. Without
          # this the site builds fine but every asset 404s in production.
          # Netlify and local dev leave it unset and serve from the root.
          NUXT_APP_BASE_URL: /naso/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4