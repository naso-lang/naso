[workspace]
resolver = "2"

members = [
    "compiler",
    "crates/stdlib",
    "crates/naso-lsp",
    "crates/naso-gates",
    "crates/nasoc-wasm",
    "crates/naso-ffi",
    "crates/async-runtime",
    "crates/naso-quantum-runtime",
    "crates/naso-verify",
    "crates/naso-cloud",
    "crates/naso-gcc-backend",
    "crates/naso-msvc-backend",
    "crates/naso-edition",
    "crates/naso-registry",
    "crates/naso-web-framework",
    "crates/naso-ml-framework",
    "crates/naso-embedded-framework",
    "bench_runner",
    "tck",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

[workspace.dependencies]
logos = { version = "0.13" }
thiserror = { version = "2.0" }
naso-compiler = { path = "compiler" }
tokio = { version = "1.35", features = ["rt", "net", "io-util", "rt-multi-thread", "macros", "io-std"] }
tower-lsp = { version = "0.20", features = ["runtime-tokio"] }
dashmap = { version = "6.1" }
z3 = { version = "0.21", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
indexmap = { version = "2.0" }
smallvec = { version = "1.0" }
anyhow = { version = "1.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5" }
colored = { version = "2.0" }
url = { version = "2.4" }
naso-gates = { path = "crates/naso-gates" }
toml = { version = "0.8" }
chrono = { version = "0.4", features = ["serde"] }

# ML dependencies for Phase 24
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
ndarray = { version = "0.16" }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# PGO profiles
[profile.pgo-generate]
inherits = "release"
debug = true
rpath = false
codegen-units = 1

[profile.pgo-use]
inherits = "release"
rpath = false
codegen-units = 1

[profile.release.package.nasoc-wasm]
opt-level = "s"
