name: Naso Self-Hosting Bootstrap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUSTFLAGS: "-C target-cpu=native"
  CARGO_INCREMENTAL: 1

jobs:
  bootstrap:
    name: Bootstrap Self-Hosting Compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install LLVM 17
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-17 clang-17 lld-17
          echo "LLVM_CONFIG=/usr/bin/llvm-config-17" >> $GITHUB_ENV
      
      - name: Install Z3
        run: |
          sudo apt-get install -y z3 libz3-dev
      
      - name: Build Rust Naso compiler
        run: |
          cd /home/node/naso
          cargo build --release --bin naso --features llvm
      
      - name: Verify Rust compiler
        run: |
          /home/node/naso/target/release/naso check examples/test.naso
      
      - name: Build Stage 1 compiler (compiler-naso with Rust naso)
        run: |
          cd /home/node/naso/compiler-naso
          /home/node/naso/target/release/naso build src/main.naso -o stage1/naso --target llvm --opt 2
      
      - name: Test Stage 1 compiler
        run: |
          cd /home/node/naso/compiler-naso
          ./stage1/naso check examples/test.naso
      
      - name: Build Stage 2 compiler (Stage 1 compiles compiler-naso)
        run: |
          cd /home/node/naso/compiler-naso
          ./stage1/naso build src/main.naso -o stage2/naso --target llvm --opt 2
      
      - name: Test Stage 2 compiler
        run: |
          cd /home/node/naso/compiler-naso
          ./stage2/naso check examples/test.naso
      
      - name: Build Self-Hosted compiler (Stage 3)
        run: |
          cd /home/node/naso/compiler-naso
          ./stage2/naso build src/main.naso -o self/naso --target llvm --opt 2
      
      - name: Test Self-Hosted compiler
        run: |
          cd /home/node/naso/compiler-naso
          ./self/naso check examples/test.naso
      
      - name: Parity Test (Rust vs Self-Hosted)
        run: |
          cd /home/node/naso/compiler-naso
          ./scripts/test_parity.sh
      
      - name: Formal Verification (Self-Hosted)
        run: |
          cd /home/node/naso/compiler-naso
          ./self/naso build --verify src/main.naso -o /tmp/verify_out.ll
      
      - name: Upload self-hosted binary
        uses: actions/upload-artifact@v4
        with:
          name: naso-self-hosted
          path: /home/node/naso/compiler-naso/self/naso
          retention-days: 7

  test:
    name: Run Full Test Suite
    runs-on: ubuntu-latest
    needs: bootstrap
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download self-hosted binary
        uses: actions/download-artifact@v4
        with:
          name: naso-self-hosted
          path: /home/node/naso/compiler-naso/self/
      
      - name: Make binary executable
        run: chmod +x /home/node/naso/compiler-naso/self/naso
      
      - name: Run compiler test suite
        run: |
          cd /home/node/naso/compiler-naso
          ./scripts/test_parity.sh

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bootstrap, test]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download self-hosted binary
        uses: actions/download-artifact@v4
        with:
          name: naso-self-hosted
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}