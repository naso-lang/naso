[package]
name = "naso-embedded-framework"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"
description = "Naso embedded framework - RTOS, HAL, and driver support for embedded systems"

[dependencies]
naso-compiler = { path = "../../compiler" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
embedded-hal = "1.0"
embedded-io = "0.7"
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }
rtic = { version = "2.4", optional = true }
critical-section = "1.1"
nb = "1.0"
heapless = "0.8"
bitflags = "2.4"
log = "0.4"
defmt = { version = "0.3", optional = true }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m-rt = { version = "0.7", optional = true }

[features]
default = []
rtic = ["dep:rtic", "dep:defmt"]
no_std = []
defmt = ["dep:defmt"]

[[bin]]
name = "naso-embed"
path = "src/bin/build.rs"
required-features = []

[[bin]]
name = "naso-embed-cli"
path = "src/bin/cli.rs"
required-features = []