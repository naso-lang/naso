[package]
name = "naso-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

[lib]
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1.35", features = ["rt", "net", "io-util", "rt-multi-thread"] }
thiserror = "2.0"
anyhow = "1.0"
async-runtime = { path = "../async-runtime" }
mio = { version = "0.8", features = ["os-poll", "net"] }
socket2 = { version = "0.5", features = ["all"] }
io-uring = { version = "0.6", features = ["io_safety"] }
once_cell = "1.19"
crossbeam = { version = "0.8", optional = true }
base64 = "0.22"
rand = "0.8"
naso_std = { path = "../stdlib" }
httparse = "1.8"
mimalloc = { version = "0.1", optional = true }

[profile.release]
codegen-units = 1
lto = true

[features]
default = []
lockfree = ["crossbeam"]
mimalloc = ["dep:mimalloc"]

[[test]]
name = "multi_threaded_accept_test"
path = "tests/multi_threaded_accept_test.rs"

[[test]]
name = "lockfree_test"
path = "tests/test_lockfree.rs"