[package]
name = "naso-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1.35", features = ["rt", "net", "io-util", "rt-multi-thread"] }
thiserror = "2.0"
anyhow = "1.0"
async-runtime = { path = "../async-runtime" }
mio = { version = "0.8", features = ["os-poll", "net"] }
socket2 = { version = "0.5", features = ["all"] }
io-uring = { version = "0.6", features = ["io_safety"] }
once_cell = "1.19"
crossbeam = { version = "0.8", optional = true }

[features]
default = []
lockfree = ["crossbeam"]