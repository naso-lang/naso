[package]
name = "naso-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
tokio = { version = "1.35", features = ["rt", "net", "io-util", "rt-multi-thread"] }
thiserror = "2.0"
anyhow = "1.0"
async-runtime = { path = "../async-runtime" }
mio = { version = "0.8", features = ["os-poll", "net"] }