[dependencies]
tokio = { version = "1.35", features = ["rt", "net", "io-util", "rt-multi-thread"] }
thiserror = "2.0"
anyhow = "1.0"
async-runtime = { path = "../async-runtime" }
mio = { version = "0.8", features = ["os-poll", "net"] }
socket2 = { version = "0.5", features = ["all"] }
io-uring = { version = "0.6", features = ["io_safety"] }
once_cell = "1.19"

[features]
default = []
# SIMD and lock-free optimizations for Phase 8
simd = ["simdutf8"]
lockfree = ["crossbeam"]
full-optimized = ["simd", "lockfree"]

[[bin]]
name = "naso_uring_backend"
path = "src/main.rs"

[[bin]]
name = "naso_uring_init"
path = "examples/nasouring_init.rs"

[[bin]]
name = "naso_uring_submit"
path = "examples/nasouring_submit.rs"

[[bin]]
name = "naso_uring_wait"
path = "examples/nasouring_wait.rs"

[[bin]]
name = "naso_uring_poll"
path = "examples/nasouring_poll.rs"

[[bin]]
name = "naso_tcp_accept_uring"
path = "examples/nasouring_tcp_accept.rs"

[[bin]]
name = "naso_read_uring"
path = "examples/nasouring_read.rs"

[[bin]]
name = "naso_write_uring"
path = "examples/nasouring_write.rs"