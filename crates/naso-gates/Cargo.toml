[package]
name = "naso-gates"
version = "0.1.0"
edition = "2024"
description = "Quantum gate matrices, the adjoint relation, and CPU state-vector simulation for Naso"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

# No dependencies, deliberately.
#
# This crate exists because the dependency arrow pointed the wrong way: `naso-verify`
# depends on `naso-compiler`, so the compiler could not reach a gate table that lived in
# the verifier. A leaf crate that BOTH depend on breaks the cycle without inverting it.
#
# It also exists to prevent a second failure: a gate table copied into both crates would
# drift, and drift in an ADJOINT table silently computes wrong inverses rather than
# failing. One definition, reachable from every layer.

[dependencies]

[lib]
# A `staticlib` as well as an `rlib`. The compiler emits calls to `qir.h`, `qir.cx`, `qir.mz` and
# friends; inside an rlib those symbols are Rust-only, so a compiled Naso program cannot be linked
# against anything. The staticlib is what makes `.naso` -> LLVM IR -> object -> native execution
# work for quantum code rather than stopping at an undefined symbol.
crate-type = ["staticlib", "rlib"]
