[package]
name = "naso-ml-framework"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"
description = "Naso-native ML framework - TensorFlow/PyTorch equivalent with quantum ML"

[dependencies]
naso-compiler = { path = "../../compiler" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"], optional = true }
ndarray = { version = "0.16", optional = true }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
tch = { version = "0.13", optional = true }
ndarray-rand = { version = "0.15", optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.4", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
plotters = { version = "0.3", optional = true }
polars = { version = "0.38", features = ["lazy", "serde"], optional = true }
arrow = { version = "51.0", optional = true }
num-traits = "0.2"
nalgebra = { version = "0.33", optional = true }

[features]
default = ["cpu"]
cpu = ["ndarray", "candle-core", "candle-nn"]
gpu = ["tch"]
cli = ["clap"]
quantum = []

[[bin]]
name = "naso-ml"
path = "src/bin/train.rs"
required-features = ["cpu"]

[[bin]]
name = "naso-ml-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]