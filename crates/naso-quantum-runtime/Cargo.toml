[package]
name = "naso-quantum-runtime"
version = "0.1.0"
edition = "2024"
description = "Quantum runtime for Naso: QIR execution, hardware backends, error mitigation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"

[dependencies]
naso-gates = { path = "../naso-gates" }
naso-ffi = { path = "../naso-ffi" }
async-runtime = { path = "../async-runtime" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "rt-multi-thread", "macros", "io-std", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
parking_lot = "0.12"
rand = { version = "0.8", features = ["std", "small_rng"] }
rand_chacha = "0.3"
crossbeam = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
url = { workspace = true }
bincode = "1.3"
num-complex = "0.4"
async-trait = "0.1"

[features]
default = ["dep:reqwest"]
# Hardware backends
ibm = ["dep:reqwest"]
ionq = ["dep:reqwest"]
rigetti = ["dep:reqwest"]
# All hardware backends
hardware = ["ibm", "ionq", "rigetti"]
# Enable hardware features for testing
full = ["hardware"]

[lib]
crate-type = ["rlib", "staticlib"]