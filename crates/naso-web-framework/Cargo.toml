[package]
name = "naso-web-framework"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"
description = "Naso-native web framework - Django/Rails equivalent with quantum-ready async"

[dependencies]
naso-compiler = { path = "../../compiler" }
naso-registry = { path = "../naso-registry" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"], optional = true }
axum = { version = "0.7", optional = true }
hyper = { version = "0.14", optional = true }
http = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
colored = "2.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"], optional = true }
validator = { version = "0.16", features = ["derive"], optional = true }
jsonwebtoken = { version = "9.0", optional = true }
bcrypt = { version = "0.13", optional = true }
rand = { version = "0.8", optional = true }
mime = { version = "0.3", optional = true }
multer = { version = "3.0", optional = true }

[features]
default = []
server = ["axum", "tokio", "tower-http", "sqlx"]
cli = ["clap"]

[[bin]]
name = "naso-web"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "naso-web-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]