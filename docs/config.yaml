baseURL: "https://nasolang.org/"
title: "Naso Language Documentation"
locale: "en-US"
defaultContentLanguage: "en"

theme: hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: "monokai"

params:
  theme:
    default: "dark"
    displayToggle: true
    assets:
      css: [css/custom.css, css/callout.css]

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: "images/logo.svg"
      width: 28
      height: 28
      alt: "Naso Logo"
    nav:
      - name: "Docs"
        url: "/"
        weight: 1
      - name: "Whitepaper"
        url: "/whitepaper/"
        weight: 2
      - name: "QTT"
        url: "/qtt/"
        weight: 3
      - name: "Philosophy"
        url: "/philosophy/"
        weight: 4
      - name: "Spec"
        url: "/spec/"
        weight: 5
      - name: "Stdlib"
        url: "/stdlib/"
        weight: 6
      - name: "Verification"
        url: "/verification/"
        weight: 7
      - name: "Playground"
        url: "https://play.nasolang.org/"
        weight: 8
      - name: Search
        params:
          type: search
        weight: 100
      - name: GitHub
        url: "https://github.com/naso-lang/naso"
        params:
          icon: github
        weight: 101

  search:
    enable: true
    type: "flexsearch"
    flexsearch:
      index: "content"
      tokenize: "forward"
      indexCode: true

  github:
    repo: "https://github.com/naso-lang/naso"
    badge: true

  footer:
    enable: true
    displayPoweredBy: false
    displayCopyright: true
    copyright: "© 2026 Naso Project. Released under Apache 2.0 / MIT License. • <a href='https://github.com/naso-lang/naso' target='_blank' rel='noopener'>GitHub</a>"

menu:
  main:
    - name: Docs
      pageRef: /
      weight: 1
    - name: Whitepaper
      pageRef: /whitepaper
      weight: 2
    - name: QTT
      pageRef: /qtt
      weight: 3
    - name: Philosophy
      pageRef: /philosophy
      weight: 4
    - name: Spec
      pageRef: /spec
      weight: 5
    - name: Stdlib
      pageRef: /stdlib
      weight: 6
    - name: Verification
      pageRef: /verification
      weight: 7
    - name: Playground
      url: "https://play.nasolang.org/"
      weight: 8
    - name: Search
      params:
        type: search
      weight: 100
    - name: GitHub
      url: "https://github.com/naso-lang/naso"
      params:
        icon: github
      weight: 101