[package]
name = "naso-tck"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naso-lang/naso"
description = "Naso Technology Compatibility Kit - Conformance test runner"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.0"
tempfile = "3.0"
regex = "1.0"
rayon = "1.0"
indicatif = "0.17"
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "naso-tck"
path = "src/main.rs"